name: build-and-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore StudyConnect.sln

      - name: Build
        run: dotnet build StudyConnect.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test StudyConnect.sln --no-build --configuration Release --verbosity normal
